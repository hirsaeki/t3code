name: Credential Protection (Windows)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/credential-protection-windows.yml"
      - "apps/server/src/auth/**"
      - "apps/server/src/textGeneration/ClaudeTextGeneration*"
      - "apps/server/src/textGeneration/testing/ClaudeTextGeneration*"
      - "packages/provider-cursor/src/server/credentialStore*"
      - "packages/provider-core/src/server/ProviderHost*"
      - "packages/shared/src/windowsSystem*"
      - "packages/shared/src/HostProcess*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/credential-protection-windows.yml"
      - "apps/server/src/auth/**"
      - "apps/server/src/textGeneration/ClaudeTextGeneration*"
      - "apps/server/src/textGeneration/testing/ClaudeTextGeneration*"
      - "packages/provider-cursor/src/server/credentialStore*"
      - "packages/provider-core/src/server/ProviderHost*"
      - "packages/shared/src/windowsSystem*"
      - "packages/shared/src/HostProcess*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: credential-protection-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  credentials:
    name: Private files and credential lifecycle
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      # Match windows-tests.yml: setup-vp's cache uses a Linux-shaped package store.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve package cache path
        id: package_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: windows-credentials-packages-v1-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install server test dependencies
        run: vp install --filter t3...

      - name: Verify ACLs, private helper settings, and cleanup
        working-directory: apps/server
        run: vp test run src/auth/privateFile.test.ts src/auth/ServerSecretStore.test.ts src/textGeneration/ClaudeTextGeneration.test.ts

      - name: Verify Cursor credential migration and logout
        working-directory: packages/provider-cursor
        run: vp test run --config ../../vite.config.ts --dir . src/server/credentialStore.test.ts
