name: Temporary P1 generated fixes

# Remove this workflow after applying its artifact in the P1 remediation PR.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: temporary-p1-generated-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: >-
      github.repository == 'hirsaeki/t3code' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Depth two of the PR merge commit includes both exact event parents.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Select reviewed PR head
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${PR_BASE_SHA}^{commit}"
          git cat-file -e "${PR_HEAD_SHA}^{commit}"
          git checkout --detach "$PR_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"

      - name: Setup existing CI dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          save-pnpm-store: "false"

      - name: Generate catalogs and format changed text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", "--no-pager", *args])

          def paths(*args):
              return [p.decode("utf-8") for p in git(*args).split(b"\0") if p]

          head = os.environ["PR_HEAD_SHA"]
          base = os.environ["PR_BASE_SHA"]
          subprocess.run(["git", "diff", "--exit-code", "HEAD", "--"], check=True)
          extensions = {
              ".ts", ".tsx", ".js", ".jsx", ".mts", ".cts", ".mjs", ".cjs",
              ".astro", ".json", ".jsonc", ".md", ".mdx", ".yaml", ".yml",
              ".css", ".scss", ".html", ".vue", ".svelte", ".toml",
          }
          changed = paths("diff", "--name-only", "--no-renames", "--diff-filter=ACM", "-z", base, head)
          allowed = {
              name for name in changed
              if Path(name).suffix in extensions
              and Path(name).is_file()
              and not Path(name).is_symlink()
              and not name.startswith(".repos/")
          }
          # These are the official commands used by scripts/i18n-check.ts.
          # Generation is offline and requires no GT or maintainer credentials.
          for app in ("apps/web", "apps/mobile"):
              subprocess.run(["node", "node_modules/gt/bin/main.js", "generate"], cwd=app, check=True)
              allowed.update(str(path) for path in Path(app, "src/i18n/translations").glob("*.json"))
          format_paths = sorted(allowed)
          if format_paths:
              subprocess.run(
                  ["vp", "fmt", "--write", "--no-error-on-unmatched-pattern", *format_paths],
                  check=True,
              )

          # Export only text produced by those two operations. Installation,
          # generated binaries, untracked files, and arbitrary workspace files
          # never become artifact payloads.
          generated = paths("diff", "--name-only", "-z", "HEAD", "--")
          unexpected = set(generated) - allowed
          if unexpected:
              raise SystemExit(f"Unexpected changed paths: {sorted(unexpected)}")
          for name in generated:
              path = Path(name)
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"Refusing non-regular artifact input: {name}")
              content = path.read_bytes()
              if b"\0" in content:
                  raise SystemExit(f"Refusing binary artifact input: {name}")
              if content.decode("utf-8").encode("utf-8") != content:
                  raise SystemExit(f"Refusing non-UTF-8 artifact input: {name}")
          patch = git("diff", "--no-ext-diff", "--no-textconv", "--full-index", "HEAD", "--", *generated) if generated else b""
          patch.decode("utf-8")
          if b"GIT binary patch" in patch or b"Binary files " in patch:
              raise SystemExit("Refusing binary diff")
          if len(patch) > 8 * 1024 * 1024:
              raise SystemExit("Generated diff exceeds 8 MiB")
          output = Path(os.environ["RUNNER_TEMP"], "p1-generated-fixes")
          output.mkdir(parents=True, exist_ok=True)
          (output / "generated-fixes.patch").write_bytes(patch)
          (output / "manifest.json").write_text(json.dumps({
              "repository": os.environ["GITHUB_REPOSITORY"],
              "base_sha": base,
              "head_sha": head,
              "created_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "files": generated,
              "patch_bytes": len(patch),
              "patch_sha256": hashlib.sha256(patch).hexdigest(),
          }, indent=2) + "\n", encoding="utf-8")
          print(f"Prepared {len(generated)} text changes ({len(patch)} bytes) for {head}")
          PY

      - name: Upload generated text diff
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p1-generated-fixes-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/p1-generated-fixes/
          if-no-files-found: error
          retention-days: 3

      - name: Record artifact identity
        shell: bash
        env:
          FIX_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          FIX_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          printf 'Artifact ID: %s\nArtifact digest: %s\nPR head: %s\n' \
            "$FIX_ARTIFACT_ID" "$FIX_ARTIFACT_DIGEST" "$PR_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Chromium for the consent scenario
        run: node apps/web/node_modules/playwright/cli.js install --with-deps chromium

      - name: Verify usage consent in the real web client
        working-directory: scripts
        run: vp run scenarios scenarios/usage-consent-stays-independent.e2e.ts --target web --output .e2e/p1-usage-consent

      - name: Upload consent scenario evidence
        id: consent_evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p1-usage-consent-${{ github.event.pull_request.head.sha }}
          path: |
            scripts/.e2e/p1-usage-consent/
            scripts/.e2e/app.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3

      - name: Record consent evidence identity
        if: always() && steps.consent_evidence.outputs.artifact-id != ''
        shell: bash
        env:
          CONSENT_ARTIFACT_ID: ${{ steps.consent_evidence.outputs.artifact-id }}
          CONSENT_ARTIFACT_DIGEST: ${{ steps.consent_evidence.outputs.artifact-digest }}
        run: |
          printf 'Consent evidence ID: %s\nConsent evidence digest: %s\nPR head: %s\n' \
            "$CONSENT_ARTIFACT_ID" "$CONSENT_ARTIFACT_DIGEST" "$PR_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
